name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          configPath: ./.lighthouserc.json
          # Config's own url/staticDistDir settings drive what's tested;
          # thresholds live in .lighthouserc.json so they're versioned
          # alongside the site instead of duplicated here.
          uploadArtifacts: true
          temporaryPublicStorage: true
